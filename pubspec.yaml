name: ayas_languageland
description: "Aya's Languageland — учим японский играя"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gemma: 1.1.0
  path_provider: ^2.1.6
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/aya/
    - assets/logo/
    - assets/map/
    - assets/music/
    - assets/sounds/